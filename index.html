<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudem Toka - Sürpriz Toka</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff5f8;
            color: #444;
            text-align: center;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        h1 {
            color: #d95f8d;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 18px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.10);
            max-width: 450px;
            margin: 0 auto;
        }

        .card img {
            width: 100%;
            max-height: 350px;
            object-fit: contain;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .button {
            display: inline-block;
            background: #f28db2;
            color: white;
            border: none;
            border-radius: 30px;
            padding: 15px 28px;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
        }

        .button:hover {
            background: #dc6f99;
            transform: scale(1.05);
        }

        #sonuc {
            margin-top: 25px;
            font-size: 22px;
            font-weight: bold;
            color: #c94f7c;
            min-height: 40px;
        }

        .footer {
            margin-top: 40px;
            font-size: 14px;
            color: #999;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🎀 Sudem Toka 🎀</h1>

    <div class="subtitle">
        Bakalım bugün sana hangi sürpriz toka çıkacak? 💕
    </div>

    <div class="card">

        <!--
        1.png dosyası index.html ile aynı klasörde olmalı.
        -->

        <img src="1.png" alt="Sürpriz Toka">

        <h2>🎁 Sürpriz Toka Hangisi?</h2>

        <p>
            Butona bas ve sürpriz tokalarımızdan birini seçelim!
        </p>

        <button class="button" onclick="surprizTokaSec()">
            🎀 Sürpriz Tokamı Seç
        </button>

        <div id="sonuc"></div>

    </div>

    <div class="footer">
        💗 El emeği ile hazırlanan Sudem Toka
    </div>

</div>

<script>

function surprizTokaSec() {

    var tokalar = [
        "🌼 Papatya Toka",
        "🍓 Çilek Toka",
        "🍒 Kiraz Toka",
        "🐝 Minik Arı Toka",
        "🌹 Gül Toka",
        "🎀 Fiyonk Toka",
        "🐞 Uğur Böceği Toka",
        "✨ Sürpriz Özel Tasarım Toka"
    ];

    var rastgele = Math.floor(Math.random() * tokalar.length);

    document.getElementById("sonuc").innerHTML =
        "Senin sürpriz tokanda: <br><br>" +
        tokalar[rastgele] +
        " 💕";
}

</script>

</body>
</html>
